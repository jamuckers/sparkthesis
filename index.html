<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spark 2.0 WebXR Static PLY Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        
        #status-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.179.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.179.0/examples/jsm/",
                "sparkjs": "https://cdn.jsdelivr.net/npm/@sparkjsdev/spark@2.0.0/dist/spark.module.js"
            }
        }
    </script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="status-overlay">Status: Initializing Core System...</div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { SparkRenderer, SplatMesh } from 'sparkjs';

        let scene, camera, renderer, sparkRenderer, splatMesh, controls;

        init();

        async function init() {
            const container = document.getElementById('canvas-container');
            const statusText = document.getElementById('status-overlay');

            // 1. Foundation Three.js Workspace Setup
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.5, 2); // Positioned at natural human height offset

            renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            
            // Enable the WebXR runtime inside the WebGL context
            renderer.xr.enabled = true; 
            container.appendChild(renderer.domElement);

            // Append the official "Enter VR" WebXR handshake button to the DOM
            document.body.appendChild(VRButton.createButton(renderer));

            // 2. Desktop Fallback Mouse Interaction Controls (Tumble / Zoom)
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.screenSpacePanning = true; 
            controls.target.set(0, 1.5, 0); // Focus camera orbit around point cloud center

            // 3. Initialize Spark 2.0 Engine Layout
            // Corrected positional configuration object mapping
            sparkRenderer = new SparkRenderer({
                renderer: renderer,
                covSplats: true, 
                memoryPoolSize: 24000000 
            });
            scene.add(sparkRenderer);

            // 4. Load the Single PLY Asset natively
            statusText.innerText = "Status: Loading assets/frame_0000.ply...";
            
            try {
                // Instantiating with forced type validation to bypass host MIME sniffing limits
                splatMesh = new SplatMesh({
                    url: 'assets/frame_0000.ply',
                    fileType: 'ply', // <-- Forces parsing without checking server text/binary mime headers
                    lod: false 
                });
                
                splatMesh.position.set(0, 0, 0); 
                scene.add(splatMesh);

                // Await inner asynchronous compilation pipeline completion
                if (splatMesh.initialized) {
                    await splatMesh.initialized;
                }

                statusText.innerText = "Status: Live. Open page on your Quest 3 Browser to transition to Immersive VR.";
            } catch (error) {
                console.error("Pipeline failure:", error);
                statusText.innerText = `Error: ${error.message}`;
                statusText.style.color = "#ff4444";
            }

            window.addEventListener('resize', onWindowResize);

            // WebXR-compatible execution animation frame loop callback
            renderer.setAnimationLoop(renderLoop);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 5. Unified Animation Rendering Loop
        function renderLoop() {
            // Only capture mouse drag events when viewing on a normal flat monitor screen
            if (!renderer.xr.isPresenting) {
                controls.update();
            }

            // Handoff to Spark to process matrix positions and stereoscopic sorting pipelines
            sparkRenderer.render(scene, camera);
        }
    </script>
</body>
</html>
